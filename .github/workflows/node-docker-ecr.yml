name: node-docker-ecr
# Reusable: build a JS app (npm/bun) then docker build + push to ECR (OIDC).
# For containerized frontends (checkout-front, management-front) that ship as images, not S3.
on:
  workflow_call:
    inputs:
      package-manager: { type: string, default: "npm" }   # npm | bun
      node-version:    { type: string, default: "22" }
      build-cmd:       { type: string, default: "npm run build" }
      platforms:
        description: >-
          Arquiteturas da imagem. O padrao segue linux/amd64 para nao mudar o
          comportamento de quem ja usa este workflow. Use
          "linux/amd64,linux/arm64" quando o destino for Graviton.
          Atencao: a construcao para arm64 num runner amd64 passa por emulacao
          QEMU e fica varias vezes mais lenta.
        type: string
        default: "linux/amd64"
      dockerfile:      { type: string, default: "Dockerfile" }
      image-name:      { type: string, required: true }     # ECR repo path (no tag)
      aws-region:      { type: string, default: "us-east-1" }
      push:            { type: boolean, default: false }
      registry:
        description: "ecr | harbor"
        type: string
        default: "ecr"
      harbor-host:
        description: >-
          Host do Harbor quando registry=harbor. O Harbor da Orkestral vive
          DENTRO da rede privada (10.1.8.252, atras do Kong interno) — sem WARP
          o push falha por tempo esgotado.
        type: string
        default: ""
      warp-organization:
        type: string
        default: ""
      warp-vnet-id:
        type: string
        default: ""
    secrets:
      AWS_OIDC_ROLE_ARN: { required: false }
      HARBOR_USERNAME: { required: false }
      HARBOR_PASSWORD: { required: false }
      CLOUDFLARE_AUTH_CLIENT_ID: { required: false }
      CLOUDFLARE_AUTH_CLIENT_SECRET: { required: false }
      # Variaveis exigidas em BUILD time (Next valida env no build e aborta se faltar).
      # Formato dotenv, uma por linha: NOME=valor. Equivalem as deployment variables
      # do Bitbucket, que nao vieram na migracao — sem isso o build quebra com
      # "Missing required environment variable".
      BUILD_ENV: { required: false }

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - if: ${{ inputs.package-manager == 'bun' }}
        uses: oven-sh/setup-bun@v2
      - if: ${{ inputs.package-manager == 'npm' }}
        uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: npm }
      - name: Install
        # não-frozen: lockfiles podem ter sido gerados com bun/npm de versão diferente
        run: ${{ inputs.package-manager == 'bun' && 'bun install' || 'npm ci || npm install' }}
      # Escreve o .env antes do build. Os valores ficam mascarados no log pelo
      # proprio Actions (vem de secret) e o arquivo morre com o runner.
      # O contexto `secrets` NAO e valido em `if:` de step (o workflow nem inicia:
      # startup_failure). Por isso o teste de vazio vai dentro do run.
      - name: Env de build
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          if [ -z "${BUILD_ENV:-}" ]; then
            echo "BUILD_ENV nao definido — seguindo sem .env"
            exit 0
          fi
          printf '%s\n' "$BUILD_ENV" > .env
          echo "variaveis carregadas: $(grep -cE '^[A-Za-z_]+=' .env)"
          grep -oE '^[A-Za-z_]+' .env | sed 's/^/  /'
      - name: Build
        run: ${{ inputs.build-cmd }}
      # docker build + push (only when push=true)
      - if: ${{ inputs.push && inputs.registry == 'ecr' }}
        uses: tinnovatech/actions/aws-oidc-login@v1
        with: { role-arn: '${{ secrets.AWS_OIDC_ROLE_ARN }}', aws-region: '${{ inputs.aws-region }}' }
      - if: ${{ inputs.push && inputs.registry == 'ecr' }}
        uses: aws-actions/amazon-ecr-login@v2
      # O Harbor da Orkestral nao encara a internet: o push so acontece de dentro
      # da rede privada, e o probe da acao prova a rota antes de tentar.
      - name: WARP (Harbor esta na rede privada)
        if: ${{ inputs.push && inputs.registry == 'harbor' }}
        uses: tinnovatech/actions/warp-connect@v2
        with:
          client-id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          client-secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
          organization: ${{ inputs.warp-organization }}
          vnet-id: ${{ inputs.warp-vnet-id }}
          probe-host: ${{ inputs.harbor-host }}
          probe-port: "443"
      - name: Harbor login
        if: ${{ inputs.push && inputs.registry == 'harbor' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.harbor-host }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      # QEMU habilita a construcao para arquitetura diferente da do runner. Sem
      # ele, `platforms` com arm64 falha: o runner e amd64 e nao sabe executar
      # binario ARM durante o build.
      - if: ${{ inputs.push && inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3
      - if: ${{ inputs.push }}
        uses: docker/setup-buildx-action@v3
      - if: ${{ inputs.push }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          # A etiqueta por commit e a que o deploy consome: `:<branch>` e mutavel,
          # e com ela a verificacao "a imagem nova e igual a que esta no ar?"
          # compara dois nomes iguais e sempre diz que sim.
          tags: |
            ${{ inputs.image-name }}:${{ github.ref_name }}
            ${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

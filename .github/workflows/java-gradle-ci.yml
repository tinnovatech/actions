name: java-gradle-ci
# Reusable: build+test+sonar, then build&push Docker image (ECR via OIDC or DigitalOcean).
# Mirrors the BB gradle-devops pipeline pattern used by the *-service repos.
on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: "17"
      gradle-args:
        type: string
        default: "clean build -x test --no-daemon"
      run-sonar:
        type: boolean
        default: true
      registry:
        description: "ecr | digitalocean | harbor | none"
        type: string
        default: "ecr"
      harbor-host:
        description: >-
          Host do Harbor quando registry=harbor. ATENCAO: o Harbor da Orkestral
          vive DENTRO da rede privada (harbor.orkestralpay.com.br resolve para
          10.1.8.252, atras do Kong interno) — sem WARP conectado o push falha
          por tempo esgotado, e por isso `warp-vnet-id` acompanha esta opcao.
        type: string
        default: ""
      warp-organization:
        description: "organizacao Zero Trust, quando o registro exigir rede privada"
        type: string
        default: ""
      warp-vnet-id:
        description: "rede virtual que anuncia a faixa privada do registro"
        type: string
        default: ""
      aws-region:
        type: string
        default: us-east-1
      image-name:
        description: "full image repo path (without tag)"
        type: string
        default: ""
      platforms:
        description: >-
          Arquiteturas da imagem. O padrao segue linux/amd64 para nao mudar o
          comportamento de quem ja usa este workflow. Use
          "linux/amd64,linux/arm64" quando o destino for Graviton.
          Atencao: a construcao para arm64 num runner amd64 passa por emulacao
          QEMU e fica varias vezes mais lenta.
        type: string
        default: "linux/amd64"
      dockerfile:
        description: "path to Dockerfile"
        type: string
        default: "Dockerfile"
      push:
        description: "build & push docker image"
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false
      AWS_OIDC_ROLE_ARN:
        required: false
      DIGITALOCEAN_ACCESS_TOKEN:
        required: false
      HARBOR_USERNAME:
        required: false
      HARBOR_PASSWORD:
        required: false
      CLOUDFLARE_AUTH_CLIENT_ID:
        required: false
      CLOUDFLARE_AUTH_CLIENT_SECRET:
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      # use the repo's wrapper (pinned Gradle version) when present; fall back to system gradle
      - name: Build
        run: |
          if [ -x ./gradlew ] || [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew ${{ inputs.gradle-args }}; else gradle ${{ inputs.gradle-args }}; fi
      # O test roda num invocation separado do build, entao flags globais passadas em
      # gradle-args (ex.: --dependency-verification off, quando o verification-metadata
      # do repo esta desatualizado) precisam ser repropagadas aqui — senao o build passa
      # e o test morre resolvendo as mesmas dependencias.
      - name: Test
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          GRADLE_ARGS: ${{ inputs.gradle-args }}
        run: |
          extra=""
          case "$GRADLE_ARGS" in
            *"--dependency-verification off"*) extra="--dependency-verification off" ;;
          esac
          if [ -f ./gradlew ]; then ./gradlew test --no-daemon $extra; else gradle test --no-daemon $extra; fi
      - name: Sonar
        if: ${{ inputs.run-sonar }}
        uses: tinnovatech/actions/sonar-scan@v1
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
  # Self-contained: rebuilda o gradle aqui em vez de receber build/ por artifact.
  # A cota de artifact storage da org estourava e travava a esteira inteira; o cache do
  # setup-gradle deixa esse rebuild barato.
  docker:
    if: ${{ inputs.push }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC for ECR
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      # Dockerfiles fazem COPY build/distributions/*.tar
      - name: Build (para o Dockerfile)
        run: |
          if [ -x ./gradlew ] || [ -f ./gradlew ]; then chmod +x ./gradlew; ./gradlew ${{ inputs.gradle-args }}; else gradle ${{ inputs.gradle-args }}; fi
      - name: AWS OIDC (ECR)
        if: ${{ inputs.registry == 'ecr' }}
        uses: tinnovatech/actions/aws-oidc-login@v1
        with:
          role-arn: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}
      - name: ECR login
        if: ${{ inputs.registry == 'ecr' }}
        uses: aws-actions/amazon-ecr-login@v2
      - name: DigitalOcean login
        if: ${{ inputs.registry == 'digitalocean' }}
        uses: tinnovatech/actions/do-registry-login@v1
        with:
          do-token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      # O Harbor da Orkestral nao encara a internet: o push so acontece de
      # dentro da rede privada. O probe da acao prova a rota ANTES do build,
      # senao a falha aparece so no fim, depois de gastar o Gradle inteiro.
      - name: WARP (Harbor esta na rede privada)
        if: ${{ inputs.registry == 'harbor' }}
        uses: tinnovatech/actions/warp-connect@v2
        with:
          client-id: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_ID }}
          client-secret: ${{ secrets.CLOUDFLARE_AUTH_CLIENT_SECRET }}
          organization: ${{ inputs.warp-organization }}
          vnet-id: ${{ inputs.warp-vnet-id }}
          probe-host: ${{ inputs.harbor-host }}
          probe-port: "443"
      - name: Harbor login
        if: ${{ inputs.registry == 'harbor' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.harbor-host }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      # QEMU habilita a construcao para arquitetura diferente da do runner. Sem
      # ele, `platforms` com arm64 falha: o runner e amd64 e nao sabe executar
      # binario ARM durante o build.
      - if: ${{ inputs.platforms != 'linux/amd64' }}
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          # DUAS etiquetas, e a segunda e a que importa para blue-green.
          #
          # `:<branch>` e mutavel — util para quem quer "a ultima de develop",
          # inutil para provar identidade de versao: duas construcoes seguidas
          # produzem `:main` e `:main`, e a verificacao "a imagem nova e igual a
          # que esta no ar?" passa a mentir, porque compara nomes iguais.
          #
          # `:<sha>` e imutavel e amarra a imagem ao commit. E o que o deploy
          # consome, e o que faz a recusa de promover para a mesma imagem
          # significar alguma coisa.
          tags: |
            ${{ inputs.image-name }}:${{ github.ref_name }}
            ${{ inputs.image-name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
